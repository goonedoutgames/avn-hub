services:
  avn-hub:
    image: ghcr.io/goonedoutgames/avn-hub:latest
    # Or build locally: docker compose up -d --build
    build: .
    ports:
      - "8080:8080" # API
      - "8081:8081" # Web UI
    volumes:
      # Persists SQLite DB, cached covers/screenshots, saves, and patches
      - ./data:/data
    environment:
      AVN_HUB_API_HOST: "0.0.0.0"
      AVN_HUB_API_PORT: "8080"
      AVN_HUB_WEB_HOST: "0.0.0.0"
      AVN_HUB_WEB_PORT: "8081"
      AVN_HUB_DATA_DIR: /data
      AVN_HUB_STATIC_DIR: /app/static
      # Browser-facing API origin (change when reverse-proxying)
      AVN_HUB_PUBLIC_API_URL: "http://127.0.0.1:8080"
      AVN_HUB_CORS_ORIGINS: "*"
      # Optional: create the app password on first boot
      # AVN_HUB_BOOTSTRAP_PASSWORD: "changeme"
      # Optional: own ./data as this UID/GID (default 10001)
      # AVN_HUB_UID: "1000"
      # AVN_HUB_GID: "1000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
