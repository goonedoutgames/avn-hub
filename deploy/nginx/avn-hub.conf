# AVN Hub — example nginx reverse proxy
#
# Recommended layout: separate hostnames for UI and API.
#   https://avn.example.com     → container :8081 (web)
#   https://avn-api.example.com → container :8080 (API)
#
# Pair with docker-compose env:
#   AVN_HUB_PUBLIC_API_URL=https://avn-api.example.com
#   AVN_HUB_CORS_ORIGINS=https://avn.example.com
#
# Install (Debian/Ubuntu style):
#   sudo cp deploy/nginx/avn-hub.conf /etc/nginx/sites-available/avn-hub.conf
#   sudo ln -sf /etc/nginx/sites-available/avn-hub.conf /etc/nginx/sites-enabled/
#   # Edit server_name and TLS paths, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: replace the ssl_certificate paths, or obtain certs with certbot:
#   sudo certbot --nginx -d avn.example.com -d avn-api.example.com

upstream avn_hub_web {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream avn_hub_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Shared proxy defaults
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Web UI
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name avn.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avn.example.com;

    # --- TLS (edit these) ---
    ssl_certificate     /etc/letsencrypt/live/avn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avn.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (enable only after HTTPS is confirmed working)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # SPA assets are tiny; uploads go to the API host
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://avn_hub_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Static UI: short connect, longer read is fine
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name avn-api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avn-api.example.com;

    # --- TLS (edit these; can share a multi-SAN cert with the UI host) ---
    ssl_certificate     /etc/letsencrypt/live/avn-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avn-api.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Saves/patches default app limit is 50 MiB; leave headroom
    client_max_body_size 64m;

    # Buffer large multipart uploads on disk instead of holding in RAM
    client_body_buffer_size 1m;
    client_body_timeout 120s;

    # F95 scrape / metadata refresh / bulk update checks can be slow
    proxy_connect_timeout 15s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # Stream request bodies for uploads (saves/patches)
    proxy_request_buffering off;

    # Allow downloading media / attachments without nginx truncating
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
    proxy_max_temp_file_size 1024m;

    location / {
        proxy_pass http://avn_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Authorization Bearer tokens and multipart Content-Type must pass through
        proxy_pass_request_headers on;
        proxy_set_header Authorization $http_authorization;
    }

    # Optional: slightly longer timeout specifically for catalog/library mutations
    location /api/v1/library/ {
        proxy_pass http://avn_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }

    location /api/v1/games/ {
        proxy_pass http://avn_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }
}
