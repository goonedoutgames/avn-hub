# AVN Hub — single-hostname path-based reverse proxy
#
#   https://avn.example.com/       → web :8081
#   https://avn.example.com/api/   → API :8080
#
# Pair with docker-compose env:
#   AVN_HUB_PUBLIC_API_URL=https://avn.example.com
#   AVN_HUB_CORS_ORIGINS=https://avn.example.com
#
# Prefer deploy/nginx/avn-hub.conf (split hostnames) when you can; this layout
# keeps one certificate and avoids cross-origin CORS setup.

upstream avn_hub_web {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream avn_hub_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name avn.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avn.example.com;

    ssl_certificate     /etc/letsencrypt/live/avn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avn.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Default for API uploads (saves/patches); UI posts are tiny
    client_max_body_size 64m;
    client_body_buffer_size 1m;
    client_body_timeout 120s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API first so /api is not swallowed by the SPA fallback
    location /api/ {
        proxy_pass http://avn_hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";

        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 1024m;
    }

    # Health without /api prefix (optional)
    location = /health {
        proxy_pass http://avn_hub_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://avn_hub_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
