name: Windows sidecar release

# Native Windows avn-hub.exe for Afterglow Local mode (separate from Docker/GHCR).
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-avn-hub
          workspaces: "."

      - name: Build release binary
        run: cargo build --locked --release -p avn-hub-server --bin avn-hub

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/avn-hub.exe dist/avn-hub.exe
          Copy-Item target/release/avn-hub.exe dist/avn-hub-windows-x64.exe
          Get-Item dist/*.exe | Format-Table Name, Length, LastWriteTime

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: avn-hub-windows-x64
          path: |
            dist/avn-hub.exe
            dist/avn-hub-windows-x64.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/avn-hub.exe
            dist/avn-hub-windows-x64.exe
          generate_release_notes: true
          body: |
            ## Windows sidecar (`avn-hub.exe`)

            Native Windows x64 binary for **Afterglow Local** mode (not the Docker image).

            Drop `avn-hub.exe` into Afterglow's `sidecar/` folder, or let Afterglow discover it via
            `AFTERGLOW_AVN_HUB_PATH` / sibling-repo build.

            ```
            Asset: avn-hub-windows-x64.exe  (same binary as avn-hub.exe)
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
