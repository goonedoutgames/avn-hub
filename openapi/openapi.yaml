        user_rating:
          type: [number, "null"]
          description: Omit to leave unchanged; null clears; number sets
        user_notes:
          type: [string, "null"]
        title:
          type: [string, "null"]
        reset_title:
          type: boolean
        description:
          type: [string, "null"]

