name: Build and publish Docker image

on:
  push:
    branches: [main, "rewrite/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CI_IMAGE: avn-hub:ci

jobs:
  # Skip expensive image builds for docs/media-only branch and PR pushes.
  # Tags and workflow_dispatch always run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Always-run event (${{ github.event_name }} / ${{ github.ref }})"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if [[ -z "${BASE}" || "${BASE}" =~ ^0+$ ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No valid base SHA; building"
            exit 0
          fi

          mapfile -t files < <(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          printf '  %s\n' "${files[@]}"

          should=false
          for f in "${files[@]}"; do
            case "$f" in
              *.md|media/*|LICENSE|.gitignore|.gitattributes|.cursor/*|deploy/nginx/*)
                continue
                ;;
              *)
                should=true
                break
                ;;
            esac
          done

          if [[ "$should" == true ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Code/config changes detected"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change; skipping Docker build"
          fi

  build-and-push:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Load locally so we can smoke-test before (or instead of) pushing
          load: true
          push: false
          tags: |
            ${{ env.CI_IMAGE }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker rm -f avn-hub-smoke >/dev/null 2>&1 || true
          docker run -d --name avn-hub-smoke \
            -e AVN_HUB_API_HOST=0.0.0.0 \
            -e AVN_HUB_WEB_HOST=0.0.0.0 \
            -e AVN_HUB_PUBLIC_API_URL=http://127.0.0.1:18080 \
            -e AVN_HUB_CORS_ORIGINS=* \
            -e AVN_HUB_BOOTSTRAP_PASSWORD=ci-smoke-password \
            -p 18080:8080 \
            -p 18081:8081 \
            "${{ env.CI_IMAGE }}"

          echo "Waiting for API health..."
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:18080/api/v1/health" >/tmp/avn-health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::API failed to become healthy"
            docker logs avn-hub-smoke || true
            exit 1
          fi
          cat /tmp/avn-health.json
          echo

          echo "Checking web UI..."
          curl -fsS "http://127.0.0.1:18081/" | head -c 400
          echo
          curl -fsS "http://127.0.0.1:18081/config.json"

          echo "Checking auth bootstrap..."
          curl -fsS -X POST "http://127.0.0.1:18080/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"password":"ci-smoke-password"}' | tee /tmp/avn-login.json
          echo

          docker rm -f avn-hub-smoke >/dev/null

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        id: push
        run: |
          set -euo pipefail
          primary=""
          while IFS= read -r tag; do
            tag="$(echo "$tag" | tr -d '[:space:]')"
            [ -n "$tag" ] || continue
            echo "Pushing ${tag}"
            docker push "${tag}"
            primary="${tag}"
          done <<EOF
          ${{ steps.meta.outputs.tags }}
          EOF
          if [ -z "$primary" ]; then
            echo "::error::No image tags to push"
            exit 1
          fi
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${primary}" | awk -F@ '{print $2}')"
          if [ -z "$digest" ]; then
            echo "::error::Could not resolve image digest for ${primary}"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${primary} @ ${digest}"

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request' && steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
